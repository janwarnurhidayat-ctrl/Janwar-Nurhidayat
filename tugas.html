<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tambah Data Siswa</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 5px;
        font-family: Arial, sans-serif;
        font-size: 10px;
        color: #333;
        background-color: #fff;
      }

      .container {
        width: 100%;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        overflow: hidden;
      }

      .header {
        background-color: #f0f2ff;
        padding: 8px 10px;
        font-size: 11px;
        font-weight: bold;
        color: #374151;
      }

      .form-body {
        padding: 10px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px 14px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      label {
        font-weight: bold;
      }

      input,
      select {
        width: 100%;
        height: 25px;
        padding: 5px 7px;
        border: 1px solid #dfe3e8;
        border-radius: 3px;
        font-family: Arial, sans-serif;
        font-size: 9px;
        background-color: white;
        color: #444;
      }

      input:focus,
      select:focus {
        outline: none;
        border-color: #818cf8;
      }

      .jenis-kelamin {
        display: flex;
        align-items: center;
        gap: 18px;
        height: 25px;
      }

      .jenis-kelamin label {
        display: flex;
        align-items: center;
        gap: 4px;
        font-weight: normal;
      }

      .jenis-kelamin input {
        width: auto;
        height: auto;
        margin: 0;
      }

      .tombol {
        display: flex;
        gap: 5px;
        margin-top: 10px;
        padding-top: 7px;
        border-top: 1px solid #eeeeee;
      }

      button {
        padding: 6px 12px;
        border: 1px solid #d1d5db;
        border-radius: 4px;
        background: white;
        font-size: 9px;                
        cursor: pointer;
      }

      .simpan {
        background-color: #6655e8;
        color: white;
        border-color: #6655e8;
      }

      button:hover {
        opacity: 0.85;
      }

      @media (max-width: 450px) {
        .form-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="header">&nbsp;Tambah Data Siswa</div>

      <div class="form-body">
        <form id="formSiswa">
          <div class="form-grid">
            <div class="form-group">
              <label for="nis">NIS</label>
              <input
                type="text"
                id="nis"
                name="nis"
                placeholder="Masukkan NIS"
                required
              />
            </div>

            <div class="form-group">
              <label>Jenis Kelamin</label>
              <div class="jenis-kelamin">
                <label>
                  <input type="radio" name="jk" value="Laki-laki" required />
                  Laki-laki
                </label>

                <label>
                  <input type="radio" name="jk" value="Perempuan" />
                  Perempuan
                </label>
              </div>
            </div>

            <div class="form-group">
              <label for="nama">Nama Lengkap</label>
              <input
                type="text"
                id="nama"
                name="nama"
                placeholder="Masukkan nama lengkap"
                required
              />
            </div>

            <div class="form-group">
              <label for="tanggal">Tanggal Lahir</label>
              <input type="date" id="tanggal" name="tanggal" required />
            </div>

            <div class="form-group">
              <label for="kelas">Kelas</label>
              <select id="kelas" name="kelas" required>
                <option value="">Pilih kelas</option>
                <option value="X">Kelas X</option>
                <option value="XI">Kelas XI</option>
                <option value="XII">Kelas XII</option>
              </select>
            </div>
          </div>

          <div class="tombol">
            <button type="submit" class="simpan">&nbsp;Simpan</button>

            <button type="reset">&nbsp;Reset</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
