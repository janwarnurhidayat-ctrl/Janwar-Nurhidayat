<!doctype html>
<html>
  <head>
    <title>Tabel Latihan</title>
    <style>
      table {
        width: 800px;
        margin: 30px auto;
        border-collapse: collapse;
        border: 3px solid black;
      }
      td {
        border: 2px solid black;
        padding: 20px 10px;
        vertical-align: top;
      }

      .tinggi {
        height: 60px;
      }
    </style>
  </head>
  <body>
    <table>
      <tr>
        <td colspan="3" class="tinggi">1</td>
        <td rowspan="3">2</td>
        <td colspan="2">3</td>
        <td rowspan="2">N</td>
      </tr>

      <tr>
        <td>4</td>
        <td>5</td>
        <td>6</td>
        <td>7</td>
        <td>8</td>
      </tr>

      <!-- BARIS 3 -->
      <tr>
        <td colspan="3">9</td>
        <td colspan="2">10</td>
        <td>N</td>
      </tr>

      <!-- BARIS 4 -->
      <tr>
        <td colspan="6" class="tinggi">N</td>
        <td>N</td>
      </tr>

      <!-- BARIS 5 -->
      <tr>
        <td>N</td>
        <td>N</td>
        <td>N</td>
        <td>N</td>
        <td>N</td>
        <td>N</td>
        <td>N</td>
      </tr>
    </table>
  </body>
</html>
